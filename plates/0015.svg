</defs><style>
:root { --ease: cubic-bezier(.8, 0, .2, 1); }
.m { animation-duration: var(--period); animation-delay: var(--delay); animation-timing-function: var(--ease); animation-iteration-count: infinite; }
.blink { animation-name: blink; } .doze { animation-name: doze; } .flicker { animation-name: flicker; } .breathe { animation-name: breathe; }
.shimmer { animation-name: shimmer; transform-box: fill-box; transform-origin: center; }
.sway { animation-name: sway; transform-box: view-box; } .swing { animation-name: swing; transform-box: view-box; }
.run { animation-name: run; } .rise { animation-name: rise; } .run, .rise { animation-timing-function: linear; }
@keyframes blink { 0%, 40% { opacity: 1; } 55%, 92% { opacity: var(--depth); } }
@keyframes doze { 0%, 70% { opacity: 1; } 75%, 92% { opacity: var(--depth); } 93% { opacity: 1; } }
@keyframes flicker { 30% { opacity: var(--depth); } 36% { opacity: 1; } 64% { opacity: calc((1 + var(--depth)) / 2); } }
@keyframes breathe { 50% { opacity: var(--depth); } }
@keyframes shimmer { 25% { transform: translateX(calc(var(--depth) * 1px)) scaleX(1.25); } 75% { transform: translateX(calc(var(--depth) * -0.6px)) scaleX(0.8); } }
@keyframes sway { 25% { transform: rotate(calc(var(--depth) * 1deg)); } 75% { transform: rotate(calc(var(--depth) * -1deg)); } }
@keyframes swing { 50% { transform: scaleX(var(--depth)); } }
@keyframes run { to { stroke-dashoffset: -100; } }
@keyframes rise { to { transform: translateY(calc(var(--depth) * -1px)); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .m { animation: none; } }
</style><rect width="1200" height="800" fill="#23211e"/>
